# RLWriter 配置 — DeepSeek 版本

llm:
  provider: "openai"  # DeepSeek 兼容 OpenAI 协议
  model: "deepseek-chat"
  api_base: "https://api.deepseek.com/v1"
  api_key: ""
  temperature: 0.7
  max_tokens: 4096
  timeout: 120

preprocessing:
  segmentation:
    method: "embedding_similarity"
    embedding_model: "text-embedding-3-small"
    similarity_threshold: 0.35
    min_scene_length: 300
    max_scene_length: 2000
    overlap: 50

  summarization:
    style_decoupling: true
    abstract_level: "high"
    max_summary_ratio: 0.3
    use_dialogue_transform: true
    scenes_per_chapter: 5
    chapters_per_volume: 8

memory:
  backend: "file"
  path: "output/memory_store"
  max_context_tokens: 8000
  retrieval_top_k: 5

reward:
  weights:
    stylometric: 0.30
    authorship_verification: 0.35
    llm_judge: 0.35

  stylometric:
    features:
      - "ttr"
      - "entropy"
      - "burstiness"
      - "pos_ngram"
      - "sentence_length_var"
      - "punctuation_density"

  llm_judge:
    dimensions:
      - "句法结构相似度"
      - "情感节奏匹配度"
      - "词汇偏好对齐度"
      - "叙事视角一致性"
      - "修辞手法运用"

optimizer:
  method: "apo"
  max_iterations: 20
  convergence_threshold: 0.02
  prompt_components:
    - "system_instruction"
    - "style_rules"
    - "example_demonstrations"

pipeline:
  input_dir: "data/novels"
  output_dir: "output"
  log_level: "INFO"

search:
  enabled: true
  mode: "llm_select"     # auto / manual / llm_select
  source: "auto"         # auto / tavily / exa / duckduckgo / wikipedia
  max_results: 3
  api_keys:
    tavily: ""
    exa: ""

inference:
  outline:
    max_tokens: 8192
    temperature: 0.7
  characters:
    max_tokens: 8192
    temperature: 0.7
  chapter:
    max_tokens: 4096
    temperature: 0.8
    target_words: "3000-5000"
  summarize:
    max_tokens: 500
    temperature: 0.2
    input_truncate: 5000
  char_state:
    max_tokens: 2000
    temperature: 0.2
  foreshadow:
    max_tokens: 1000
    temperature: 0.2
    input_truncate: 5000
  nexus_sum:
    max_length: 5000
    max_tokens: 2500
  memory_warnings:
    max_tokens: 2000
    temperature: 0.3
  auto_continue: true
  max_continues: 2
